<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台灣地理環境區域分布圖</title>
    <!-- 主要套件 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-chart-geo@4.2.2/build/index.umd.min.js"></script>
    <!-- 必要的 D3 套件 -->
    <script src="https://d3js.org/d3-array.v2.min.js"></script>
    <script src="https://d3js.org/d3-geo.v2.min.js"></script>
    <script src="https://d3js.org/d3-format.v2.min.js"></script>
    <script src="https://d3js.org/d3-fetch.v2.min.js"></script>
    <script src="https://d3js.org/topojson-client.v3.min.js"></script>
    <style>
        body {
            font-family: 'Microsoft JhengHei', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #faf7f2;
            color: #3e2723;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background-color: #fff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 10px rgba(62, 39, 35, 0.1);
        }
        .visualization-title {
            color: #5d4037;
            text-align: center;
            margin-bottom: 5px;
            font-size: 1.5em;
        }
        .visualization-subtitle {
            color: #8d6e63;
            text-align: center;
            margin-bottom: 20px;
            font-size: 1em;
            font-weight: normal;
        }
        .visualization-description {
            margin-bottom: 25px;
            color: #6d4c41;
            line-height: 1.6;
            text-align: justify;
        }
        .chart-container {
            height: 600px;
            margin: 20px 0;
            position: relative;
        }
        .data-source {
            font-size: 0.8em;
            color: #8d6e63;
            text-align: right;
            margin-top: 20px;
        }
        .notes {
            font-size: 0.9em;
            margin-top: 30px;
            padding: 15px;
            background-color: #efebe9;
            border-left: 4px solid #a1887f;
            border-radius: 0 4px 4px 0;
        }
        .legend {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        .legend-item {
            display: flex;
            align-items: center;
            margin: 0 10px 10px 0;
        }
        .legend-color {
            width: 20px;
            height: 20px;
            margin-right: 5px;
            border-radius: 4px;
        }
        .legend-label {
            font-size: 0.9em;
            color: #5d4037;
        }
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #8d6e63;
            font-size: 1.2em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 class="visualization-title">[分析主題]</h2>
        <h3 class="visualization-subtitle">[分析時間或範圍]</h3>
        
        <div class="visualization-description">
            <!-- 這裡將由 AI 填入數據描述 -->
            本視覺化呈現了台灣各縣市[分析指標]的地理分布情況。通過地圖方式展示，能夠直觀了解各地區[指標名稱]的差異，幫助識別地理分布特徵和區域性趨勢。
        </div>
        
        <div class="chart-container">
            <div class="loading" id="loading">載入地圖中...</div>
            <canvas id="taiwanMap"></canvas>
        </div>
        
        <div class="legend" id="customLegend"></div>
        
        <div class="notes">
            <strong>分析說明：</strong>
            <!-- 這裡將由 AI 填入分析說明 -->
            地圖顏色深淺表示[指標名稱]的高低，顏色越深表示數值越高。[在此補充關於數據、分析方法或結果解讀的詳細說明]。
        </div>
        
        <div class="data-source">
            數據來源：[資料來源] | 最後更新：<span id="update-date"></span>
        </div>
    </div>
    
    <script>
        // 設置當前日期
        document.getElementById('update-date').textContent = new Date().toLocaleDateString('zh-TW');
        
        // 台灣縣市數據（這部分將由 AI 根據新聞數據替換）
        const taiwanData = [
            { city: '臺北市', value: 95 },
            { city: '新北市', value: 88 },
            { city: '基隆市', value: 45 },
            { city: '桃園市', value: 78 },
            { city: '新竹市', value: 72 },
            { city: '新竹縣', value: 65 },
            { city: '苗栗縣', value: 58 },
            { city: '臺中市', value: 85 },
            { city: '彰化縣', value: 62 },
            { city: '南投縣', value: 42 },
            { city: '雲林縣', value: 53 },
            { city: '嘉義市', value: 57 },
            { city: '嘉義縣', value: 49 },
            { city: '臺南市', value: 76 },
            { city: '高雄市', value: 82 },
            { city: '屏東縣', value: 61 },
            { city: '宜蘭縣', value: 55 },
            { city: '花蓮縣', value: 47 },
            { city: '臺東縣', value: 39 },
            { city: '澎湖縣', value: 35 },
            { city: '金門縣', value: 32 },
            { city: '連江縣', value: 28 }
        ];
        
        const mapTitle = '[數據標題]（單位：[單位]）';
        
        // 定義棕色系顏色範圍
        function getColor(value, min, max) {
            // 計算標準化值 (0-1)
            const normalized = (value - min) / (max - min);
            
            // 棕色系漸變 - 從淺色到深色
            const r = Math.round(233 - normalized * 132); // 233->101
            const g = Math.round(212 - normalized * 145); // 212->67
            const b = Math.round(185 - normalized * 152); // 185->33
            
            return `rgb(${r}, ${g}, ${b})`;
        }
        
        // 創建地圖
        async function createMap() {
            try {
                // 載入台灣縣市地圖數據 - 這是真正需要引入的外部資源
                // // 這裡提供了一個 GitHub 托管的台灣縣市 GeoJSON 資源，可以替換為你自己的資源
                const response = await fetch('https://raw.githubusercontent.com/Lung-Yi/data/refs/heads/main/taiwan_map.geo.json');
                const taiwanGeoJson = await response.json();
                
                // 隱藏載入提示
                document.getElementById('loading').style.display = 'none';
                
                // 找出最大值和最小值
                const values = taiwanData.map(d => d.value);
                const minValue = Math.min(...values);
                const maxValue = Math.max(...values);
                
                // 創建顏色數組
                const colorScale = {};
                taiwanData.forEach(d => {
                    colorScale[d.city] = getColor(d.value, minValue, maxValue);
                });
                
                // 準備地圖數據
                const ctx = document.getElementById('taiwanMap').getContext('2d');
                
                // 創建數據集
                const choroplethData = taiwanGeoJson.features.map(feature => {
                    const countyName = feature.properties.COUNTYNAME;
                    const dataItem = taiwanData.find(item => item.city === countyName);
                    return {
                        feature: feature,
                        value: dataItem ? dataItem.value : 0
                    };
                });
                
                // 創建Chart.js的Choropleth地圖
                const chart = new Chart(ctx, {
                    type: 'choropleth',
                    data: {
                        labels: taiwanGeoJson.features.map(f => f.properties.COUNTYNAME),
                        datasets: [{
                            label: '[指標名稱]',
                            data: choroplethData,
                            borderColor: '#FFF',
                            borderWidth: 1,
                            backgroundColor: function(context) {
                                const value = context.raw?.value || 0;
                                return getColor(value, minValue, maxValue);
                            },
                            // 鏈接GeoJSON和數據
                            outline: taiwanGeoJson.features
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        showOutline: true,
                        showGraticule: false,
                        plugins: {
                            title: {
                                display: true,
                                text: mapTitle,
                                color: '#5d4037',
                                font: {
                                    size: 16,
                                    weight: 'bold'
                                },
                                padding: {
                                    bottom: 20
                                }
                            },
                            legend: {
                                display: false
                            },
                            tooltip: {
                                callbacks: {
                                    label: function(context) {
                                        const countyName = context.label;
                                        const dataItem = taiwanData.find(item => item.city === countyName);
                                        if (dataItem) {
                                            return `${countyName}: ${dataItem.value} [單位]`;
                                        }
                                        return `${countyName}: 無數據`;
                                    }
                                }
                            }
                        },
                        scales: {
                            projection: {
                                axis: 'x',
                                projection: 'mercator'
                            }
                        }
                    }
                });
                
                // 創建自定義圖例
                createCustomLegend(minValue, maxValue);
                
            } catch (error) {
                console.error('地圖載入失敗:', error);
                document.getElementById('loading').innerHTML = `
                    <div style="color: #d32f2f; text-align: center;">
                        地圖載入失敗。請確保已正確引入台灣地理數據和所有必要套件。<br>
                        錯誤信息: ${error.message}
                    </div>
                `;
            }
        }
        
        // 創建自定義圖例
        function createCustomLegend(min, max) {
            const legendDiv = document.getElementById('customLegend');
            const steps = 5; // 圖例中的顏色等級數量
            
            for (let i = 0; i < steps; i++) {
                const value = min + (max - min) * i / (steps - 1);
                const color = getColor(value, min, max);
                
                const legendItem = document.createElement('div');
                legendItem.className = 'legend-item';
                
                const colorBox = document.createElement('div');
                colorBox.className = 'legend-color';
                colorBox.style.backgroundColor = color;
                
                const label = document.createElement('div');
                label.className = 'legend-label';
                label.textContent = Math.round(value) + (i === steps - 1 ? '+' : '');
                
                legendItem.appendChild(colorBox);
                legendItem.appendChild(label);
                legendDiv.appendChild(legendItem);
            }
        }
        
        // 啟動地圖創建
        createMap();
    </script>
</body>
</html>
