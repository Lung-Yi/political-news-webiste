<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>可自定義的棕色事件時間線</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', 'Helvetica', sans-serif;
        }
        
        body {
            background-color: #f8f5f1; /* 淺棕色背景 */
            color: #5d4037; /* 深棕色文字 */
            padding: 20px;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #3e2723; /* 暗棕色標題 */
            font-weight: bold;
        }
        
        .timeline {
            position: relative;
            max-width: 900px;
            margin: 0 auto;
        }
        
        .timeline::after {
            content: '';
            position: absolute;
            width: 6px;
            background-color: #8d6e63; /* 中棕色時間線 */
            top: 0;
            bottom: 0;
            left: 50%;
            margin-left: -3px;
            border-radius: 5px;
        }
        
        .event {
            padding: 10px 40px;
            position: relative;
            width: 50%;
            margin-bottom: 1px; /* 極度緊湊的間距 */
        }
        
        .event::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            background-color: #efebe9; /* 淺棕色圓點背景 */
            border: 4px solid #a1887f; /* 中棕色圓點邊框 */
            border-radius: 50%;
            top: 15px;
            z-index: 1;
        }
        
        .left {
            left: 0;
        }
        
        .right {
            left: 50%;
        }
        
        .left::after {
            right: -11px;
        }
        
        .right::after {
            left: -11px;
        }
        
        .content {
            padding: 15px;
            background-color: #e0d4ca; /* 加深的卡片背景色 */
            position: relative;
            border-radius: 6px;
            box-shadow: 0 3px 8px rgba(121, 85, 72, 0.3); /* 加深的棕色陰影 */
            transition: all 0.3s ease;
            cursor: pointer;
            border-left: 4px solid #a1887f; /* 左側棕色邊框 */
        }
        
        .right .content {
            border-left: none;
            border-right: 4px solid #a1887f; /* 右側棕色邊框 */
        }
        
        .content:hover {
            box-shadow: 0 5px 15px rgba(121, 85, 72, 0.3);
            transform: translateY(-5px);
        }
        
        .date {
            color: #6d4c41; /* 中深棕色日期 */
            font-weight: bold;
            margin-bottom: 3px;
            font-size: 14px;
        }
        
        .title {
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 6px;
            color: #4e342e; /* 深棕色標題 */
        }
        
        .description {
            font-size: 14px;
            line-height: 1.4;
        }
        
        .details {
            display: none;
            margin-top: 10px;
            line-height: 1.6;
            font-size: 14px;
            color: #5d4037; /* 深棕色詳細文字 */
            border-top: 1px dashed #bcaaa4; /* 淺棕色虛線分隔 */
            padding-top: 8px;
        }
        
        .expand-btn {
            display: block;
            margin-top: 10px;
            color: #8d6e63; /* 中棕色按鈕文字 */
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
        }
        
        .expand-btn:hover {
            color: #6d4c41; /* 深棕色懸停狀態 */
        }
        
        @media screen and (max-width: 768px) {
            .timeline::after {
                left: 31px;
            }
            
            .event {
                width: 100%;
                padding-left: 70px;
                padding-right: 25px;
                left: 0;
            }
            
            .right .content {
                border-right: none;
                border-left: 4px solid #a1887f; /* 所有卡片左側棕色邊框 */
            }
            
            .event::after {
                left: 21px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>【您的時間線標題】</h1>
        <div class="timeline" id="timeline">
            <!-- 事件會透過JavaScript動態添加 -->
        </div>
    </div>

    <script>
        // 事件資料 - 在此處修改您的事件內容
        const events = [
            {
                date: "【時間/階段1】", // 修改為您的日期或階段
                title: "【事件標題1】", // 修改為您的事件標題
                description: "【簡短描述1】這裡填寫事件的簡短描述，一到兩句話即可。", // 修改為簡短描述
                details: "【詳細內容1】這裡可以填寫事件的詳細說明，可以包含多個句子，描述事件的背景、過程和結果等。這部分內容只有在用戶點擊「查看詳情」後才會顯示。" // 修改為詳細內容
            },
            {
                date: "【時間/階段2】",
                title: "【事件標題2】",
                description: "【簡短描述2】這裡填寫事件的簡短描述，說明這個階段的主要工作。",
                details: "【詳細內容2】這裡是事件的詳細說明，可以補充更多相關資訊。您可以描述這個階段的具體工作項目、達成的目標或面臨的挑戰等。"
            },
            {
                date: "【時間/階段3】",
                title: "【事件標題3】",
                description: "【簡短描述3】第三個事件的簡要說明，概述這一階段的關鍵點。",
                details: "【詳細內容3】第三個事件的詳細資訊。您可以在此處添加具體細節，例如參與人員、重要決策、關鍵成果等。這部分內容可以幫助讀者更全面地了解此事件。"
            },
            {
                date: "【時間/階段4】",
                title: "【事件標題4】",
                description: "【簡短描述4】第四個事件的簡要介紹，表明此階段的重點。",
                details: "【詳細內容4】這裡詳細描述第四個事件的完整內容。可以包括事件的前因後果、影響範圍、關聯事件等更深入的信息。您可以根據需要調整詳情的長度。"
            },
            {
                date: "【時間/階段5】",
                title: "【事件標題5】",
                description: "【簡短描述5】第五個事件的概述，簡明扼要地說明此階段的特點。",
                details: "【詳細內容5】在這裡展開描述第五個事件的細節。這部分內容應該對前面的簡短描述進行擴展，提供更多有價值的信息，幫助讀者深入理解事件的各個方面。"
            }
            // 您可以按照相同的格式添加更多事件，或刪減現有事件
        ];

        // 創建時間線
        function createTimeline() {
            const timelineEl = document.getElementById('timeline');
            
            events.forEach((event, index) => {
                const eventEl = document.createElement('div');
                eventEl.className = `event ${index % 2 === 0 ? 'left' : 'right'}`;
                
                const contentEl = document.createElement('div');
                contentEl.className = 'content';
                
                const dateEl = document.createElement('div');
                dateEl.className = 'date';
                dateEl.textContent = event.date;
                
                const titleEl = document.createElement('div');
                titleEl.className = 'title';
                titleEl.textContent = event.title;
                
                const descriptionEl = document.createElement('div');
                descriptionEl.className = 'description';
                descriptionEl.textContent = event.description;
                
                const detailsEl = document.createElement('div');
                detailsEl.className = 'details';
                detailsEl.textContent = event.details;
                
                // 添加「查看詳情」按鈕
            const expandBtn = document.createElement('span');
                expandBtn.className = 'expand-btn';
                expandBtn.textContent = '查看詳情 +';
                expandBtn.onclick = function() {
                    if (detailsEl.style.display === 'block') {
                        detailsEl.style.display = 'none';
                        expandBtn.textContent = '查看詳情 +';
                    } else {
                        detailsEl.style.display = 'block';
                        expandBtn.textContent = '收起 -';
                    }
                };
                
                contentEl.appendChild(dateEl);
                contentEl.appendChild(titleEl);
                contentEl.appendChild(descriptionEl);
                contentEl.appendChild(detailsEl);
                contentEl.appendChild(expandBtn);
                
                eventEl.appendChild(contentEl);
                timelineEl.appendChild(eventEl);
            });
        }
        
        // 頁面載入時創建時間線
        window.onload = createTimeline;

        // 自定義函數 - 可以通過JavaScript動態添加新事件
        // 使用方法: addNewEvent("您的日期", "您的標題", "您的描述", "您的詳細內容");
        function addNewEvent(date, title, description, details) {
            const event = {
                date: date,
                title: title,
                description: description,
                details: details || ""
            };
            
            events.push(event);
            document.getElementById('timeline').innerHTML = "";
            createTimeline();
        }
        
        // 您也可以在此處添加其他自定義功能，例如:
        // - 事件篩選功能
        // - 時間線排序功能
        // - 保存/載入時間線數據功能
        // - 導出為PDF或圖片功能
    </script>
</body>
</html>
